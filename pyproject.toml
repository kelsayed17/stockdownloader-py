[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockdownloader"
version = "1.0.0"
description = "Stock analysis, backtesting, and options trading platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "scipy>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
]
ml = [
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
]

[project.scripts]
# ── Backtesting (unified) ─────────────────────────────────────────
spy-backtest = "stockdownloader.app.backtest_app:main"
intraday-backtest = "stockdownloader.app.backtest_app:main_intraday"
options-backtest = "stockdownloader.app.backtest_app:main_options"
dmi-vwap-backtest = "stockdownloader.app.backtest_app:main_dmi_vwap"
symbol-analysis = "stockdownloader.app.symbol_analysis_app:main"
# ── Tournaments ───────────────────────────────────────────────────
grand-tournament = "stockdownloader.app.tournament.cli:main_walkforward"
multi-timeframe-tournament = "stockdownloader.app.tournament.cli:main_baseline"
multi-timeframe-optimizer = "stockdownloader.app.tournament.cli:main_greedy"
exit-tournament = "stockdownloader.app.exit_tournament_app:main"
signal-stack-tournament = "stockdownloader.app.signal_stack_tournament:main"
# ── ML pipelines ────────────────────────────────────────────────
ml-pipeline = "stockdownloader.app.ml_pipeline_app:main"
gme-ml-pipeline = "stockdownloader.app.gme_ml_pipeline_app:main"
spy-ml-pipeline = "stockdownloader.app.spy_ml_pipeline_app:main"
ml-train = "stockdownloader.app.ml_train_app:main"
# ── Utilities & standalone ────────────────────────────────────────
intraday-accumulate = "stockdownloader.app.intraday_accumulate_app:main"
strategy-optimize = "stockdownloader.app.optimize_app:main"
walk-forward = "stockdownloader.app.walk_forward_app:main"
generate-pinescript = "stockdownloader.app.generate_pinescript:main"
pipeline = "stockdownloader.app.pipeline_app:main"
gme-analysis = "stockdownloader.app.gme_analysis_app:main"
signal-monitor = "stockdownloader.app.monitor_app:main"
pattern-discovery = "stockdownloader.app.pattern_discovery_app:main"
value-screener = "stockdownloader.app.value_screener_app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "live: tests that hit real external APIs (Yahoo Finance, NASDAQ) -- run with pytest -m live",
]
addopts = "-m 'not live'"

[tool.setuptools.packages.find]
where = ["src"]
include = ["stockdownloader*"]
