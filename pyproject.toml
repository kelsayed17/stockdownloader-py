[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockdownloader"
version = "1.0.0"
description = "Stock analysis, backtesting, and options trading platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "scipy>=1.14.0",
    "curl_cffi>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
]
ml = [
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
]

[project.scripts]
# ── Backtesting (unified) ─────────────────────────────────────────
spy-backtest = "stockdownloader.app.backtest:main"
intraday-backtest = "stockdownloader.app.backtest:main_intraday"
options-backtest = "stockdownloader.app.backtest:main_options"
dmi-vwap-backtest = "stockdownloader.app.backtest:main_dmi_vwap"
symbol-analysis = "stockdownloader.app.analysis:main"
# ── Tournaments ───────────────────────────────────────────────────
grand-tournament = "stockdownloader.app.tournament.cli:main_walkforward"
multi-timeframe-tournament = "stockdownloader.app.tournament.cli:main_baseline"
multi-timeframe-optimizer = "stockdownloader.app.tournament.cli:main_greedy"
exit-tournament = "stockdownloader.app.tournament:main_exit_tournament"
signal-stack-tournament = "stockdownloader.app.tournament:main_signal_stack"
# ── ML pipelines ────────────────────────────────────────────────
ml-pipeline = "stockdownloader.app.ml_pipeline:main_generic"
gme-ml-pipeline = "stockdownloader.gme.pipeline:main"
spy-ml-pipeline = "stockdownloader.app.ml_pipeline:main"
ml-train = "stockdownloader.app.ml_train:main"
spy-ml-ensemble = "stockdownloader.app.spy_ml_ensemble:main"
# ── Utilities & standalone ────────────────────────────────────────
intraday-accumulate = "stockdownloader.app.backtest:main_accumulate"
strategy-optimize = "stockdownloader.app.optimize:main_optimize"
walk-forward = "stockdownloader.app.optimize:main_walk_forward"
generate-pinescript = "stockdownloader.app.pinescript:main"
pipeline = "stockdownloader.app.pipeline_app:main"
gme-analysis = "stockdownloader.gme.app:main"
gme-options-analysis = "stockdownloader.gme.options_analysis:main"
gme-regsho-backfill = "stockdownloader.gme.regsho_backfill:main"
signal-monitor = "stockdownloader.app.monitor:main"
pattern-discovery = "stockdownloader.app.pattern_discovery:main"
value-screener = "stockdownloader.app.value_screener:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "live: tests that hit real external APIs (Yahoo Finance, NASDAQ) -- run with pytest -m live",
]
addopts = "-m 'not live'"

[tool.setuptools.packages.find]
where = ["src"]
include = ["stockdownloader*"]
